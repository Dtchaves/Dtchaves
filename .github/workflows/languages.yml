name: Languages

on:
  workflow_dispatch:

  schedule:
    - cron: "30 0 * * *"

jobs:
  languages:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate language metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: Dtchaves
          filename: metrics.plugin.languages.svg

          # Visual
          template: repository

          # Não mostrar informações gerais do perfil
          base: ""

          # Languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          # Mostrar até 8
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          # Cores diferentes automaticamente
          plugin_languages_colors: rainbow

          # Não contar notebooks
          plugin_languages_ignored: Jupyter Notebook

          # Não juntar o restante em "Other"
          plugin_languages_other: no
